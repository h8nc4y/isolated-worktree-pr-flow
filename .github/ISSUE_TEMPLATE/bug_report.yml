name: Bug report
description: Report a sanitized problem with the skill or examples.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not paste tokens, credentials, raw agent transcripts with private data, private repository names, or internal absolute paths.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observable problem without private data.
      placeholder: Following the skill, the cleanup guard still refused to delete the branch because...
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: Symptom class
      options:
        - Main-checkout WIP was modified by the flow (isolation broken)
        - Worktree creation failed (already checked out / unwritable location)
        - Fresh-worktree dependency gap (node_modules / virtualenv)
        - CI polling guidance issue (bounded poll)
        - Cleanup guard false pass or false refusal (2a / 2b)
        - Branch deletion refused (not fully merged)
        - Worktree removal failed (untracked content / permission denied)
        - Concurrent-session collision detection gap
        - Documentation error or unclear guidance
        - Other sanitized symptom
    validations:
      required: true
  - type: textarea
    id: sanitized-checks
    attributes:
      label: Sanitized checks performed
      description: Summarize safe facts only. Use placeholder repo and path names.
      placeholder: |
        Merge mode used: --squash
        gh pr view state: MERGED
        merge-base --is-ancestor exit code: 1
        git rev-parse <branch> vs headRefOid: mismatch
        Main checkout status --short unchanged: yes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The 2b guard should have allowed branch deletion after the squash merge.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The guard reported a headRefOid mismatch even though the PR was merged.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed tokens, credentials, customer data, private repository names, and internal absolute paths.
          required: true
